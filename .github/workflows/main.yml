name: Ultimate GameCube Decompiler (Full ISO)

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: 'Название игры (латиницей, например: shrek_superslam)'
        required: true
        default: 'my_game'
      iso_url:
        description: 'Пнямая ссылка на скачивание полного ISO-образа игры'
        required: true

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang git curl

    - name: Build DolRecomp Tool
      run: |
        cmake -S . -B build -DDOLRECOMP_ENABLE_LLVM=OFF
        cmake --build build --config Release

    - name: Download Game ISO from Cloud
      run: |
        # Скачиваем тяжелый ISO-образ прямо на сервера GitHub
        curl -L -o game.iso "${{ github.event.inputs.iso_url }}"

    - name: Extract ISO via DolRecomp
      run: |
        # Встроенная подкоманда DolRecomp сама распакует диск
        ./build/dolrecomp extract game.iso ./extracted_game

    - name: Run Static Recompiler on extracted main.dol
      run: |
        mkdir decompiled_output
        # Запускаем декомпиляцию извлеченного файла main.dol
        ./build/dolrecomp --gamecube ./extracted_game/sys/main.dol decompiled_output

    - name: Upload C-Code Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.game_name }}-c-code
        path: decompiled_output/
